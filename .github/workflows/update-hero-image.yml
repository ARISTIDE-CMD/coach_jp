SVG

      - name: Replace old hero photo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://images.pexels.com/photos/10295891/pexels-photo-10295891.jpeg?cs=srgb&dl=pexels-k2production-10295891.jpg&fm=jpg'
          new = 'assets/hero-african-students.svg'
          if old not in s:
              raise SystemExit('Ancienne image hero introuvable dans index.html')
          s = s.replace(old, new, 1).replace('alt="Étudiante devant la Tour Eiffel"', 'alt="Étudiants africains souriants qui souhaitent étudier en France"', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-hero-image.yml
          git add index.html assets/hero-african-students.svg .github/workflows/update-hero-image.yml
          git commit -m "feat: replace hero image with African student illustration"
          git push
