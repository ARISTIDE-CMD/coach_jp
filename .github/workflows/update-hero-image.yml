name: Replace Coach JP hero image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create illustrated hero image
